name: Feature request
description: Suggest something Relay should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/Haakooto/Relay/wiki/Roadmap) first: it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How you imagine it working. A rough sketch is fine.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Pane or area
      options:
        - Alarms
        - Timers and relays
        - Relay language
        - Stopwatch
        - Clock
        - Widgets
        - Settings
        - Bedtime
        - Calendar
        - Automation and assistants
        - Something else
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and anything else
      description: Other ways you have tried, or how the stock Clock app does it.

# Update PRs for Gradle dependencies and GitHub Actions, grouped and monthly so they stay few.
# Security updates for known vulnerabilities come separately, as soon as an advisory appears
# (repo Settings -> Code security -> Dependabot security updates).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*", "org.jetbrains.kotlinx*"]
      tooling:
        patterns: ["com.android.tools.build*", "io.gitlab.arturbosch.detekt*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
